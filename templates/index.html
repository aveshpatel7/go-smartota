<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Smart - OTA Update</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        h1 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="file"] { padding: 10px; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Go Smart OTA Update</h1>
        <form action="/send_ota" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="node_id">Target Node ID:</label>
                <input type="text" name="node_id" id="node_id" placeholder="Enter Node ID (e.g. Node_123)" required>
            </div>
            <div class="form-group">
                <label for="file">Firmware File (.bin):</label>
                <input type="file" name="file" id="file" accept=".bin" required>
            </div>
            <button type="submit">Upload & Send Update</button>
        </form>
    </div>
</body>
</html>
